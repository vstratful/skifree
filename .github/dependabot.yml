# dependabot.yml
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "staging"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    ignore:
      # @types/node major version is pinned to match the Node runtime (engines.node)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "staging"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
